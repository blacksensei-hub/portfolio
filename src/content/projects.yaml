- slug: attendx
  title: AttendX
  summary: >-
    Class attendance for GCTU. Students scan a rotating QR code on the web or
    the Expo app and the register fills itself live, with location checks, a
    fraud review queue, excused absences, timetables, and an admin console
    with analytics and an audit trail.
  tech:
    - React
    - React Native
    - Expo
    - Node.js
    - Express.js
    - Sequelize
    - PostgreSQL
    - Socket.IO
    - Framer Motion
  image: ../assets/attendx.webp
  demoUrl: https://atttend-x.vercel.app
  repoUrl: https://github.com/blacksensei-hub/AttendX.git
  order: 0

- slug: urbanpulse
  title: UrbanPulse
  summary: >-
    A full-stack storefront for a Ghanaian streetwear brand: a scroll-driven
    film hero, Paystack checkout in cedis, restock alerts, a drop list by
    email and SMS, order tracking without an account, and an admin that runs
    the whole shop.
  tech:
    - React
    - Vite
    - Tailwind CSS
    - Node.js
    - Express.js
    - PostgreSQL
    - Paystack
    - Framer Motion
  image: ../assets/urbanpulse.png
  demoUrl: https://urbanpulsee.vercel.app
  repoUrl: https://github.com/blacksensei-hub/UrbanPulse-frontend.git
  order: 1
