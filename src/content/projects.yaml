- slug: attendx
  title: AttendX
  summary: >-
    Class attendance for GCTU. Lecturers open a session, students scan a QR
    code on the web or the Expo mobile app, and the register fills itself in
    real time, with location checks, appeals, and exportable reports.
  tech:
    - React
    - React Native
    - Expo
    - Node.js
    - Express.js
    - Sequelize
    - PostgreSQL
    - Socket.IO
  image: ../assets/attendx.png
  demoUrl: https://atttend-x.vercel.app
  repoUrl: https://github.com/blacksensei-hub/AttendX.git
  order: 0

- slug: urbanpulse
  title: UrbanPulse
  summary: >-
    A full-stack storefront for a Ghanaian streetwear brand: a scroll-driven
    film hero, Paystack checkout in cedis, an installable PWA, and an admin
    dashboard for orders, stock, and content.
  tech:
    - React
    - Vite
    - Tailwind CSS
    - Node.js
    - Express.js
    - PostgreSQL
    - Paystack
  image: ../assets/urbanpulse.png
  demoUrl: https://urbanpulsee.vercel.app
  repoUrl: https://github.com/blacksensei-hub/UrbanPulse-frontend.git
  order: 1
