# Checks every push to main and every pull request, then uploads the tested
# dist/ to Cloudflare Pages (spec 0007). main deploys to production; any other
# branch deploys a preview. Fork pull requests run the checks but never deploy.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# One run per ref: a newer push cancels the older run so stale code never ships.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  SITE_URL: https://jeffrey-ankrah.pages.dev
  CI: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test --run
      - run: pnpm exec playwright install --with-deps chromium
      # The Playwright webServer runs `pnpm build`, so this also type checks and
      # produces the dist/ that ships.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy:
    needs: check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jeffrey-ankrah --branch=${{ github.head_ref || github.ref_name }}
